name: Builtin Libraries CI

on:
  push:
    paths:
      - 'tools/builtin-libs/**'
      - '.github/workflows/builtin-libs-ci.yml'
    branches-ignore:
      - 'wip/**'
  pull_request:
    paths:
      - 'tools/builtin-libs/**'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Built-in Libraries
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin


      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Android SDK command-line tools and platform/build-tools
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unzip wget

          # Ensure SDK root directory exists
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$HOME"
          CLI_ZIP="commandlinetools-linux_latest.zip"

          # Download and verify
          wget -O "$CLI_ZIP" "https://dl.google.com/android/repository/commandlinetools-linux_latest.zip"
          if [ ! -s "$CLI_ZIP" ]; then
            echo "::error::Downloaded $CLI_ZIP is missing or empty"
            ls -l "$CLI_ZIP" || true
            exit 1
          fi

          unzip "$CLI_ZIP" -d cmdline-tools-tmp
          ls -la cmdline-tools-tmp

          # Support both archive layouts (some zips put files under cmdline-tools/, others directly)
          if [ -d cmdline-tools-tmp/cmdline-tools ]; then
            SRC_DIR="cmdline-tools-tmp/cmdline-tools"
          else
            SRC_DIR="cmdline-tools-tmp"
          fi

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv "$SRC_DIR"/* "$ANDROID_HOME/cmdline-tools/latest/" || { echo "::error::mv failed"; ls -la "$SRC_DIR"; exit 1; }

          rm -rf cmdline-tools-tmp "$CLI_ZIP"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          # Diagnostics to confirm JDK and sdkmanager are available
          java -version
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list || true

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses

          # Retry installs (handle transient network errors)
          for i in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-37" "build-tools;37.0.0"; then
              break
            fi
            echo "sdkmanager install attempt $i failed — retrying in 5s..."
            sleep 5
            if [ "$i" = 3 ]; then
              echo "::error::sdkmanager failed after 3 attempts"
              exit 1
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Built-in Libraries Assets
        run: |
          python tools/builtin-libs/build_builtin_libs.py

      - name: Verify Resources (AAPT2)
        run: |
          python tools/builtin-libs/verify_resources.py

      - name: Verify Classes & Dependencies
        run: |
          python tools/builtin-libs/verify_classes.py

      - name: Verify Generated Code (ECJ Compilation)
        run: |
          python tools/builtin-libs/verify_generated_code.py

      - name: Upload Built Assets Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builtin-libs-assets-${{ github.sha }}
          path: app/src/main/assets/libs/
