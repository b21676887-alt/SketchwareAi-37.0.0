name: Builtin Libraries CI

on:
  push:
    paths:
      - 'tools/builtin-libs/**'
      - '.github/workflows/builtin-libs-ci.yml'
    branches-ignore:
      - 'wip/**'
  pull_request:
    paths:
      - 'tools/builtin-libs/**'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Built-in Libraries
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin


      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install Android SDK command-line tools and platform/build-tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget

          # Ensure SDK root directory exists (ANDROID_HOME is set in job env)
          mkdir -p "$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$HOME"
          CLI_ZIP="commandlinetools-linux_latest.zip"

          # Download command-line tools (uses latest redirecting endpoint)
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux_latest.zip" -O "$CLI_ZIP"
          unzip -q "$CLI_ZIP" -d cmdline-tools-tmp
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools-tmp/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          rm -rf cmdline-tools-tmp "$CLI_ZIP"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          # Accept licenses and install required components. Adjust API/build-tools versions if needed.
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Built-in Libraries Assets
        run: |
          python tools/builtin-libs/build_builtin_libs.py

      - name: Verify Resources (AAPT2)
        run: |
          python tools/builtin-libs/verify_resources.py

      - name: Verify Classes & Dependencies
        run: |
          python tools/builtin-libs/verify_classes.py

      - name: Verify Generated Code (ECJ Compilation)
        run: |
          python tools/builtin-libs/verify_generated_code.py

      - name: Upload Built Assets Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builtin-libs-assets-${{ github.sha }}
          path: app/src/main/assets/libs/
