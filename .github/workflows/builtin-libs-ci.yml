name: Builtin Libraries CI

on:
  push:
    paths:
      - 'tools/builtin-libs/**'
      - '.github/workflows/builtin-libs-ci.yml'
    branches-ignore:
      - 'wip/**'
  pull_request:
    paths:
      - 'tools/builtin-libs/**'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Built-in Libraries
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd /tmp

          curl -fsSL -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          if [ -d "$PWD/cmdline-tools" ]; then
            cp -a "$PWD/cmdline-tools/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
          else
            # في بعض النسخ تكون المجلد باسم cmdline-tools-linux-XXXX
            find . -maxdepth 2 -type d -name 'cmdline-tools*' -print -quit | head -n 1 | while read -r dir; do
              cp -a "$dir/." "$ANDROID_SDK_ROOT/cmdline-tools/latest/"
            done
          fi

          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;37.0.0" "platforms;android-37"

      - name: Set up Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Built-in Libraries Assets
        run: |
          python tools/builtin-libs/build_builtin_libs.py

      - name: Verify Resources (AAPT2)
        run: |
          python tools/builtin-libs/verify_resources.py

      - name: Verify Classes & Dependencies
        run: |
          python tools/builtin-libs/verify_classes.py

      - name: Verify Generated Code (ECJ Compilation)
        run: |
          python tools/builtin-libs/verify_generated_code.py

      - name: Upload Built Assets Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: builtin-libs-assets-${{ github.sha }}
          path: app/src/main/assets/libs/
